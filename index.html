<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treino de Conversação - Tênis de Mesa</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #16a34a;
            --success-bg: #f0fdf4;
            --success-border: #bbf7d0;
            --danger: #dc2626;
            --danger-bg: #fef2f2;
            --danger-border: #fecaca;
            --border: #cbd5e1;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 16px;
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        h1 {
            font-size: 1.25rem;
            color: var(--primary);
        }

        .mode-selector {
            display: flex;
            background: var(--bg-color);
            padding: 4px;
            border-radius: 8px;
            gap: 4px;
        }

        .mode-btn {
            background: transparent;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-muted);
            min-height: 44px;
        }

        .mode-btn.active {
            background: var(--card-bg);
            color: var(--primary);
            box-shadow: 0 2px 4px rgb(0 0 0 / 0.05);
        }

        .progress-bar-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .level-indicators {
            display: flex;
            gap: 4px;
            justify-content: space-between;
        }

        .level-dot {
            flex: 1;
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            transition: background 0.3s;
        }

        .level-dot.active {
            background: var(--primary);
        }

        .level-dot.completed {
            background: var(--success);
        }

        .status-text {
            font-size: 0.9rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        /* Elements grid / overview */
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card-section {
            background: var(--bg-color);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .section-label {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .subject-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary);
        }

        .context-phrase {
            font-size: 1rem;
            color: var(--text-main);
        }

        .partner-speech {
            font-size: 1.1rem;
            font-style: italic;
            background: #e2e8f0;
            padding: 12px 16px;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
        }

        .model-phrase-display {
            font-size: 1.1rem;
            font-weight: 600;
            color: #334155;
            background: #f1f5f9;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px dashed var(--border);
        }

        /* Response area */
        .response-area {
            min-height: 60px;
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            background: var(--card-bg);
        }

        .response-word {
            background: var(--bg-color);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            min-height: 44px;
            display: flex;
            align-items: center;
        }

        .response-word.locked {
            background: var(--success-bg);
            border-color: var(--success-border);
            color: var(--success);
            cursor: default;
        }

        .response-placeholder {
            color: var(--text-muted);
            font-style: italic;
        }

        /* Tray words */
        .tray-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            min-height: 70px;
        }

        .tray-word {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            box-shadow: 0 1px 2px rgb(0 0 0 / 0.05);
            min-height: 44px;
            display: flex;
            align-items: center;
            user-select: none;
            transition: transform 0.1s, background 0.1s;
        }

        .tray-word:active {
            transform: scale(0.96);
        }

        .tray-word.used {
            opacity: 0.3;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* Controls */
        .controls-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: var(--text-main);
            flex: 1;
            min-width: 120px;
        }

        .btn:hover {
            background: var(--bg-color);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        /* Voice mode elements */
        .voice-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
            padding: 20px 0;
        }

        .mic-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            transition: transform 0.2s, background 0.2s;
        }

        .mic-btn.recording {
            background: var(--danger);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.4); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(220, 38, 38, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }

        .transcript-box {
            width: 100%;
            background: #f1f5f9;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            min-height: 80px;
            font-size: 1.1rem;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .voice-helper-text {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-align: center;
        }

        /* Feedback and Modals */
        .feedback-box {
            padding: 16px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .feedback-box.success {
            background: var(--success-bg);
            border: 1px solid var(--success-border);
            color: var(--success);
        }

        .feedback-box.error {
            background: var(--danger-bg);
            border: 1px solid var(--danger-border);
            color: var(--danger);
        }

        .subjects-list {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .subject-badge {
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 4px;
            background: var(--border);
            color: var(--text-muted);
        }

        .subject-badge.completed {
            background: var(--success);
            color: white;
        }

        .subject-badge.current {
            background: var(--primary);
            color: white;
            font-weight: bold;
        }

        footer {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
            border-top: 1px solid var(--bg-color);
            padding-top: 12px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 24px;
            max-width: 500px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 10px 25px -5px rgb(0 0 0 / 0.2);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="top-row">
            <h1>Treino de Conversação: Tênis de Mesa</h1>
            <div class="mode-selector">
                <button class="mode-btn active" id="modeTouchBtn" onclick="app.setMode('touch')">Tocar nas palavras</button>
                <button class="mode-btn" id="modeVoiceBtn" onclick="app.setMode('voice')">Falar</button>
            </div>
        </div>
        <div class="progress-bar-container">
            <div class="level-indicators" id="levelIndicators">
                <div class="level-dot active" title="Nível 1"></div>
                <div class="level-dot" title="Nível 2"></div>
                <div class="level-dot" title="Nível 3"></div>
                <div class="level-dot" title="Nível 4"></div>
                <div class="level-dot" title="Nível 5"></div>
                <div class="level-dot" title="Nível 6"></div>
                <div class="level-dot" title="Nível 7"></div>
            </div>
            <div class="status-text">
                <span id="currentLevelText">Nível 1 de 7</span>
                <span id="completedCountText">Concluídos: 0/6</span>
            </div>
        </div>
        <div class="subjects-list" id="subjectsListHeader"></div>
    </header>

    <main class="main-content" id="mainContent">
        <!-- Dynamic content goes here -->
    </main>

    <footer>
        O modo por voz precisa de internet e de permissão de microfone, e pode não funcionar com o arquivo aberto diretamente do disco.
    </footer>
</div>

<!-- Level Up / Completion Modals container -->
<div id="modalContainer"></div>

<script>
// Application Data & Constants
const SUBJECTS = [
    {
        id: 'raquete',
        name: 'A raquete',
        context: 'Equipamento essencial para bater na bolinha.',
        partner: 'comprei uma raquete nova, mas não entendo nada de borracha.',
        model: 'eu prefiro a borracha lisa',
        keywords: ['raquete', 'borracha', 'lisa', 'rápida', 'nova', 'espuma', 'cabo']
    },
    {
        id: 'bolinha',
        name: 'A bolinha',
        context: 'Pequena esfera usada nas partidas.',
        partner: 'gosto de treinar com várias cores diferentes.',
        model: 'eu gosto de jogar com a bolinha branca',
        keywords: ['bolinha', 'bola', 'branca', 'jogar', 'cor', 'treinar']
    },
    {
        id: 'rede',
        name: 'A rede',
        context: 'Divide a mesa ao meio.',
        partner: 'esta rede parece um pouco estranha hoje.',
        model: 'a rede me parece um pouco baixa',
        keywords: ['rede', 'baixa', 'alta', 'mesa', 'dividir', 'altura']
    },
    {
        id: 'mesa',
        name: 'A mesa',
        context: 'Superfície onde o jogo acontece.',
        partner: 'treinar nesta mesa é sempre muito divertido.',
        model: 'eu acho a mesa muito boa para jogar',
        keywords: ['mesa', 'boa', 'jogar', 'superfície', 'treinar']
    },
    {
        id: 'regra',
        name: 'Uma regra do jogo',
        context: 'Normas que organizam a partida.',
        partner: 'fiquei confuso com aquela regra do início do jogo.',
        model: 'eu acho essa regra bem fácil de entender',
        keywords: ['regra', 'fácil', 'entender', 'jogo', 'partida', 'início']
    },
    {
        id: 'destaque',
        name: 'Um destaque do tênis de mesa brasileiro',
        context: 'Atletas que representam o país.',
        partner: 'temos grandes atletas jogando internacionalmente.',
        model: 'eu acho o Hugo Calderano muito rápido',
        keywords: ['hugo', 'calderano', 'brasileiro', 'rápido', 'atleta', 'destaque']
    }
];

const DRACTORS_POOL = ['correr', 'amanhã', 'porque', 'muito', 'depois', 'rapidamente', 'ontem', 'mas', 'embora'];
const COMPLEMENTS_POOL = {
    'raquete': ['lisa', 'rápida', 'nova'],
    'bolinha': ['branca', 'amarela', 'nova'],
    'rede': ['baixa', 'alta', 'boa'],
    'mesa': ['boa', 'larga', 'rápida'],
    'regra': ['fácil', 'simples', 'boa'],
    'destaque': ['rápido', 'forte', 'bom']
};

class SpeechTrainerApp {
    constructor() {
        this.state = this.loadState() || {
            level: 1,
            currentSubjectIndex: 0,
            completedSubjects: [],
            mode: 'touch', // 'touch' or 'voice'
            selectedWords: [],
            lastTranscript: '',
            lastResultType: null, // 'A', 'B', 'C'
            lastFeedbackMessage: '',
            voiceAttemptDiscardedCount: 0,
            totalTouchCount: 0,
            totalVoiceCount: 0,
            consecutiveVoiceFailures: 0,
            showWhyModal: false
        };

        this.recognition = null;
        this.isRecording = false;
        this.initSpeechRecognition();
        this.render();
    }

    loadState() {
        try {
            const saved = localStorage.getItem('tableTennisTrainerState');
            return saved ? JSON.parse(saved) : null;
        } catch (e) {
            return null;
        }
    }

    saveState() {
        try {
            localStorage.setItem('tableTennisTrainerState', JSON.stringify(this.state));
        } catch (e) {}
    }

    resetAll() {
        if (confirm('Tem certeza de que deseja reiniciar todo o treino?')) {
            localStorage.removeItem('tableTennisTrainerState');
            this.state = {
                level: 1,
                currentSubjectIndex: 0,
                completedSubjects: [],
                mode: 'touch',
                selectedWords: [],
                lastTranscript: '',
                lastResultType: null,
                lastFeedbackMessage: '',
                voiceAttemptDiscardedCount: 0,
                totalTouchCount: 0,
                totalVoiceCount: 0,
                consecutiveVoiceFailures: 0,
                showWhyModal: false
            };
            this.render();
        }
    }

    setMode(mode) {
        this.state.mode = mode;
        this.state.selectedWords = [];
        this.state.lastTranscript = '';
        this.saveState();
        this.render();
    }

    initSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            this.recognition = new SpeechRecognition();
            this.recognition.lang = 'pt-BR';
            this.recognition.continuous = false;
            this.recognition.interimResults = false;

            this.recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                this.state.lastTranscript = transcript;
                this.isRecording = false;
                this.processVoiceResponse(transcript);
            };

            this.recognition.onerror = (event) => {
                this.isRecording = false;
                this.render();
            };

            this.recognition.onend = () => {
                this.isRecording = false;
                this.render();
            };
        }
    }

    toggleRecord() {
        if (!this.recognition) {
            alert('Reconhecimento de fala não suportado neste navegador. Alternando para o modo por toque.');
            this.setMode('touch');
            return;
        }

        if (this.isRecording) {
            this.recognition.stop();
            this.isRecording = false;
        } else {
            try {
                this.state.lastTranscript = '';
                this.recognition.start();
                this.isRecording = true;
            } catch (e) {
                this.isRecording = false;
            }
        }
        this.render();
    }

    discardVoiceAttempt() {
        this.state.voiceAttemptDiscardedCount++;
        this.state.lastTranscript = '';
        this.state.lastResultType = null;
        this.state.lastFeedbackMessage = '';
        this.saveState();
        this.render();
    }

    getCurrentSubject() {
        // Filter subjects that are active in this level
        const activeSubjects = this.getActiveSubjectsForLevel();
        const subId = activeSubjects[this.state.currentSubjectIndex];
        return SUBJECTS.find(s => s.id === subId) || SUBJECTS[0];
    }

    getActiveSubjectsForLevel() {
        // Levels 1-4: all 6 subjects
        // Levels 5-6: 3 subjects, then 1 subject
        // Level 7: all subjects or subset? Rule: Levels 5 & 6 use 3 and 1 subjects respectively. Let's map properly.
        if (this.state.level === 5) return [SUBJECTS[0].id, SUBJECTS[1].id, SUBJECTS[2].id];
        if (this.state.level === 6) return [SUBJECTS[0].id];
        return SUBJECTS.map(s => s.id);
    }

    getModelParts(subject) {
        const words = subject.model.split(' ');
        const base = words.slice(0, words.length - 1).join(' ');
        const gap = words[words.length - 1];
        return { base, gap, full: subject.model, words };
    }

    getTrayWords(subject) {
        const { words, gap } = this.getModelParts(subject);
        const baseWords = words.slice(0, words.length - 1);
        const distractors = ['correr', 'amanhã', 'porque'];
        const complements = COMPLEMENTS_POOL[subject.id] || ['lisa', 'rápida', 'nova'];
        
        // Combine base words (excluding gap), complements, and distractors, then shuffle deterministically or stable
        const tray = [...baseWords, ...complements, ...distractors];
        // Simple deterministic shuffle based on subject id length to keep stability
        return tray.sort((a, b) => a.localeCompare(b));
    }

    selectWord(word) {
        this.state.selectedWords.push(word);
        this.saveState();
        this.render();
    }

    removeSelectedWord(index) {
        this.state.selectedWords.splice(index, 1);
        this.saveState();
        this.render();
    }

    undoWord() {
        this.state.selectedWords.pop();
        this.saveState();
        this.render();
    }

    clearWords() {
        this.state.selectedWords = [];
        this.saveState();
        this.render();
    }

    restartSubject() {
        this.state.selectedWords = [];
        this.state.lastResultType = null;
        this.state.lastFeedbackMessage = '';
        this.saveState();
        this.render();
    }

    speakCurrentPhrase() {
        const subject = this.getCurrentSubject();
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(subject.model);
            utterance.lang = 'pt-BR';
            window.speechSynthesis.speak(utterance);
        }
    }

    evaluateTouchResponse() {
        this.state.totalTouchCount++;
        const subject = this.getCurrentSubject();
        const { words, gap } = this.getModelParts(subject);
        const userSentence = this.state.selectedWords.join(' ');
        const baseWords = words.slice(0, words.length - 1);
        const userBaseWords = this.state.selectedWords.slice(0, baseWords.length);
        const userGapWord = this.state.selectedWords[baseWords.length];

        // Check if incomplete
        if (this.state.selectedWords.length < words.length) {
            this.state.lastResultType = 'C';
            this.state.lastFeedbackMessage = 'A resposta está incompleta. Faltam palavras para formar a frase inteira.';
            this.saveState();
            this.render();
            return;
        }

        // Check base correctness (ignoring articles/prepositions/conjunctions/pronouns minor differences if needed, or exact base match)
        let baseMatch = true;
        for (let i = 0; i < baseWords.length; i++) {
            if (userBaseWords[i] !== baseWords[i]) {
                // Check if it's a minor particle difference
                const minorWords = ['o', 'a', 'os', 'as', 'um', 'uma', 'de', 'do', 'da', 'em', 'no', 'na', 'eu', 'que'];
                if (!minorWords.includes(baseWords[i]) || !minorWords.includes(userBaseWords[i])) {
                    baseMatch = false;
                    break;
                }
            }
        }

        if (!baseMatch) {
            this.state.lastResultType = 'C';
            // Find divergence point
            let divergenceWord = baseWords[0];
            for (let i = 0; i < baseWords.length; i++) {
                if (userBaseWords[i] !== baseWords[i]) {
                    divergenceWord = baseWords[i];
                    break;
                }
            }
            this.state.lastFeedbackMessage = `Divergência encontrada. A palavra esperada era "${divergenceWord}".`;
            this.saveState();
            this.render();
            return;
        }

        // Check gap (A or B)
        const complements = COMPLEMENTS_POOL[subject.id] || [];
        if (userGapWord === gap) {
            this.state.lastResultType = 'A';
            this.state.lastFeedbackMessage = 'Muito bem! Interação com script concluída com sucesso.';
            this.markSubjectCompleted(subject.id);
        } else if (complements.includes(userGapWord)) {
            this.state.lastResultType = 'B';
            this.state.lastFeedbackMessage = 'Excelente! Complemento próprio aceito com sucesso.';
            this.markSubjectCompleted(subject.id);
        } else {
            this.state.lastResultType = 'C';
            this.state.lastFeedbackMessage = 'A palavra final não é compatível com a lacuna.';
        }
        this.saveState();
        this.render();
    }

    processVoiceResponse(transcript) {
        this.state.totalVoiceCount++;
        const subject = this.getCurrentSubject();
        const cleanTranscript = transcript.toLowerCase().trim();
        const words = cleanTranscript.split(/\s+/);

        // Level 1: expects model phrase or close variant. Level >= 2: >= 5 words and contains at least one keyword.
        const keywords = subject.keywords;
        const hasKeyword = keywords.some(kw => cleanTranscript.includes(kw));

        if (this.state.level === 1) {
            // Check closeness to model
            if (hasKeyword && words.length >= 3) {
                this.state.lastResultType = 'A';
                this.state.lastFeedbackMessage = 'Muito bem! Sua fala foi compreendida com sucesso.';
                this.markSubjectCompleted(subject.id);
                this.state.consecutiveVoiceFailures = 0;
            } else {
                this.state.lastResultType = 'C';
                this.state.lastFeedbackMessage = `Diga uma frase um pouco maior sobre ${subject.name.toLowerCase()}`;
                this.state.consecutiveVoiceFailures++;
            }
        } else {
            // Level >= 2
            if (words.length >= 5 && hasKeyword) {
                this.state.lastResultType = 'B';
                this.state.lastFeedbackMessage = 'Excelente! Resposta falada aceita com sucesso.';
                this.markSubjectCompleted(subject.id);
                this.state.consecutiveVoiceFailures = 0;
            } else {
                this.state.lastResultType = 'C';
                this.state.lastFeedbackMessage = `Diga uma frase um pouco maior sobre ${subject.name.toLowerCase()}`;
                this.state.consecutiveVoiceFailures++;
            }
        }
        this.saveState();
        this.render();
    }

    markSubjectCompleted(subjectId) {
        if (!this.state.completedSubjects.includes(subjectId)) {
            this.state.completedSubjects.push(subjectId);
        }
    }

    nextSubject() {
        this.state.lastResultType = null;
        this.state.lastFeedbackMessage = '';
        this.state.selectedWords = [];
        this.state.lastTranscript = '';

        const activeSubjects = this.getActiveSubjectsForLevel();
        if (this.state.currentSubjectIndex < activeSubjects.length - 1) {
            this.state.currentSubjectIndex++;
        } else {
            // Level completed! Check if level < 7, advance level. If level == 7, finish.
            if (this.state.level < 7) {
                this.state.level++;
                this.state.currentSubjectIndex = 0;
                this.state.completedSubjects = [];
            } else {
                // Training finished!
                this.state.finished = true;
            }
        }
        this.saveState();
        this.render();
    }

    render() {
        // Update header status
        document.getElementById('currentLevelText').innerText = `Nível ${this.state.level} de 7`;
        
        const activeSubjects = this.getActiveSubjectsForLevel();
        const completedInLevel = activeSubjects.filter(id => this.state.completedSubjects.includes(id)).length;
        document.getElementById('completedCountText').innerText = `Concluídos: ${completedInLevel}/${activeSubjects.length}`;

        // Level dots
        const dots = document.querySelectorAll('.level-dot');
        dots.forEach((dot, idx) => {
            dot.className = 'level-dot';
            if (idx + 1 < this.state.level) dot.classList.add('completed');
            else if (idx + 1 === this.state.level) dot.classList.add('active');
        });

        // Mode selector buttons
        document.getElementById('modeTouchBtn').className = `mode-btn ${this.state.mode === 'touch' ? 'active' : ''}`;
        document.getElementById('modeVoiceBtn').className = `mode-btn ${this.state.mode === 'voice' ? 'active' : ''}`;

        // Subjects list header badges
        const headerList = document.getElementById('subjectsListHeader');
        headerList.innerHTML = SUBJECTS.map((s, idx) => {
            const isActive = activeSubjects.includes(s.id);
            if (!isActive) return '';
            const isDone = this.state.completedSubjects.includes(s.id);
            const isCurrent = activeSubjects[this.state.currentSubjectIndex] === s.id;
            let cls = 'subject-badge';
            if (isDone) cls += ' completed';
            if (isCurrent) cls += ' current';
            return `<div class="${cls}">${s.name}</div>`;
        }).join('');

        // Main content area
        const main = document.getElementById('mainContent');

        if (this.state.finished) {
            main.innerHTML = `
                <div class="card-section" style="text-align: center; gap: 16px;">
                    <h2 class="subject-title">Treino Concluído com Sucesso!</h2>
                    <p class="context-phrase">Parabéns por completar todos os níveis do treino de conversação de tênis de mesa.</p>
                    <div style="background: white; padding: 16px; border-radius: 8px; border: 1px solid var(--border); text-align: left; display: flex; flex-direction: column; gap: 8px;">
                        <strong>Resumo da Sessão:</strong>
                        <div>Nível final alcançado: ${this.state.level}</div>
                        <div>Total de interações por toque: ${this.state.totalTouchCount}</div>
                        <div>Total de interações por voz: ${this.state.totalVoiceCount}</div>
                        <div>Tentativas por voz descartadas: ${this.state.voiceAttemptDiscardedCount}</div>
                    </div>
                    <button class="btn btn-primary" onclick="app.resetAll()">Recomeçar o treino</button>
                </div>
            `;
            return;
        }

        const subject = this.getCurrentSubject();
        const { base, gap, words: modelWords } = this.getModelParts(subject);

        // Calculate model phrase display based on level (Fading logic)
        let displayedModel = subject.model;
        if (this.state.level === 2) {
            // hides last word
            displayedModel = modelWords.slice(0, modelWords.length - 1).join(' ') + ' ____';
        } else if (this.state.level === 3) {
            // hides last 2 words
            displayedModel = modelWords.slice(0, modelWords.length - 2).join(' ') + ' ____ ____';
        } else if (this.state.level === 4) {
            // hides last 3 words
            displayedModel = modelWords.slice(0, modelWords.length - 3).join(' ') + ' ____ ____ ____';
        } else if (this.state.level >= 5) {
            // Levels 5-7: fading context or no model displayed
            if (this.state.level === 7) {
                displayedModel = 'Nenhuma frase-modelo exibida neste nível.';
            }
        }

        let html = `
            <div class="card-section">
                <div class="section-label">Assunto atual</div>
                <div class="subject-title">${subject.name}</div>
                <div class="context-phrase">${subject.context}</div>
            </div>

            <div class="card-section">
                <div class="section-label">Fala do parceiro</div>
                <div class="partner-speech">"${subject.partner}"</div>
            </div>
        `;

        if (this.state.level < 7) {
            html += `
                <div class="card-section">
                    <div class="section-label">O que você pode dizer (Frase-modelo)</div>
                    <div class="model-phrase-display">${displayedModel}</div>
                </div>
            `;
        }

        if (this.state.mode === 'touch') {
            const trayWords = this.getTrayWords(subject);
            html += `
                <div class="card-section">
                    <div class="section-label">Monte sua resposta (Frase inteira)</div>
                    <div class="response-area" id="responseArea">
                        ${this.state.selectedWords.length === 0 ? '<span class="response-placeholder">Toque nas palavras abaixo para montar a frase...</span>' : ''}
                        ${this.state.selectedWords.map((w, idx) => `<div class="response-word" onclick="app.removeSelectedWord(${idx})">${w}</div>`).join('')}
                    </div>
                </div>

                <div class="card-section">
                    <div class="section-label">Bandeja de palavras</div>
                    <div class="tray-container">
                        ${trayWords.map(w => `<div class="tray-word" onclick="app.selectWord('${w}')">${w}</div>`).join('')}
                    </div>
                </div>

                <div class="controls-row">
                    <button class="btn" onclick="app.undoWord()">Desfazer</button>
                    <button class="btn" onclick="app.clearWords()">Limpar</button>
                    <button class="btn" onclick="app.restartSubject()">Recomeçar este assunto</button>
                    <button class="btn" onclick="app.speakCurrentPhrase()">Falar a frase</button>
                </div>

                <button class="btn btn-primary" style="width: 100%; margin-top: 8px;" onclick="app.evaluateTouchResponse()">Enviar Resposta</button>
            `;
        } else {
            // Voice mode
            html += `
                <div class="card-section voice-section">
                    <button class="mic-btn ${this.isRecording ? 'recording' : ''}" onclick="app.toggleRecord()">
                        🎤
                    </button>
                    <div class="voice-helper-text">
                        ${this.isRecording ? 'Ouvindo... Fale agora.' : 'Toque no microfone para falar.'}
                    </div>
                    <div class="transcript-box">
                        ${this.state.lastTranscript ? `"${this.state.lastTranscript}"` : '<span class="response-placeholder">A transcrição aparecerá aqui...</span>'}
                    </div>
                    ${this.state.lastTranscript ? `
                        <button class="btn" onclick="app.discardVoiceAttempt()">Não foi isso que eu disse</button>
                    ` : ''}
                    <div class="voice-helper-text" style="font-weight: 500; color: var(--primary);">
                        Se a fala não estiver sendo reconhecida, toque em Alternar para Tocar e continue a atividade pelo toque.
                    </div>
                </div>
            `;
        }

        // Feedback / Result display
        if (this.state.lastResultType) {
            const isSuccess = this.state.lastResultType === 'A' || this.state.lastResultType === 'B';
            html += `
                <div class="feedback-box ${isSuccess ? 'success' : 'error'}">
                    <strong>${isSuccess ? 'Muito bem!' : 'Atenção:'}</strong>
                    <div>${this.state.lastFeedbackMessage}</div>
                    ${!isSuccess ? `
                        <button class="btn" style="background: white; border-color: currentColor;" onclick="app.toggleWhyModal(true)">Por que não contou?</button>
                    ` : ''}
                    ${isSuccess ? `
                        <button class="btn btn-primary" onclick="app.nextSubject()">Próximo assunto</button>
                    ` : ''}
                </div>
            `;
        }

        main.innerHTML = html;

        // Render modal if open
        const modalContainer = document.getElementById('modalContainer');
        if (this.state.showWhyModal) {
            const received = this.state.mode === 'touch' ? this.state.selectedWords.join(' ') : this.state.lastTranscript;
            modalContainer.innerHTML = `
                <div class="modal-overlay">
                    <div class="modal-card">
                        <h3>Por que não contou?</h3>
                        <div><strong>O que o aplicativo recebeu:</strong> ${received || 'Nenhuma palavra registrada'}</div>
                        <div><strong>A frase-modelo completa:</strong> ${subject.model}</div>
                        <div><strong>Instrução:</strong> ${this.state.lastFeedbackMessage}</div>
                        <button class="btn btn-primary" onclick="app.toggleWhyModal(false)">Fechar</button>
                    </div>
                </div>
            `;
        } else {
            modalContainer.innerHTML = '';
        }
    }

    toggleWhyModal(show) {
        this.state.showWhyModal = show;
        this.render();
    }
}

const app = new SpeechTrainerApp();
</script>

</body>
</html>
